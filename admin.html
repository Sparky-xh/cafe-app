<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeaToast - Kitchen Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --bg-header: #ffffff;
      --bg-chip: #ffffff;
      --text-chip: #64748b;
      --border-chip: #cbd5e1;
      --chip-active-bg: #0f172a;
      --chip-active-text: #ffffff;
      --modal-bg: #ffffff;
      --modal-header-bg: #f8fafc;
      --hover-bg: #f1f5f9;
      --social-bg: #f8fafc;
      --tiktok-icon-color: #000000;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --bg-body: #090d16;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --bg-card: #131c2e;
      --border-color: #1e293b;
      --bg-header: #131c2e;
      --bg-chip: #131c2e;
      --text-chip: #94a3b8;
      --border-chip: #334155;
      --chip-active-bg: #38bdf8;
      --chip-active-text: #090d16;
      --modal-bg: #131c2e;
      --modal-header-bg: #090d16;
      --hover-bg: #1e293b;
      --social-bg: #090d16;
      --tiktok-icon-color: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease; }
    body { background: var(--bg-body); color: var(--text-main); padding: 20px 16px 40px 16px; min-height: 100vh; }
    
    .dashboard-container { max-width: 1240px; margin: 0 auto; }

    /* Header */
    .header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; background: var(--bg-header); padding: 18px 24px; border-radius: 16px; box-shadow: var(--shadow-md); border: 1px solid var(--border-color); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-color); }
    .brand h1 { font-size: 22px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
    .live-badge { background: #dcfce7; color: #15803d; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    [data-theme="dark"] .live-badge { background: #064e3b; color: #4ade80; }
    .live-dot { width: 7px; height: 7px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .social-links { display: flex; align-items: center; gap: 6px; background: var(--social-bg); padding: 4px 8px; border-radius: 10px; border: 1px solid var(--border-color); }
    .social-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 8px; text-decoration: none; transition: transform 0.15s ease; }
    .social-btn:hover { transform: translateY(-2px); }
    .social-btn svg { width: 18px; height: 18px; display: block; }
    
    .social-btn.instagram { background: rgba(225, 48, 108, 0.1); }
    .social-btn.instagram svg { fill: #e1306c; }
    .social-btn.facebook { background: rgba(24, 119, 242, 0.1); }
    .social-btn.facebook svg { fill: #1877f2; }
    .social-btn.tiktok { background: rgba(100, 116, 139, 0.15); }
    .social-btn.tiktok svg { fill: var(--tiktok-icon-color); }

    .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn-action { background: var(--bg-body); color: var(--text-main); font-size: 13px; font-weight: 700; padding: 10px 16px; border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer; }
    .btn-action:hover { background: var(--hover-bg); border-color: var(--text-sub); }
    
    .enable-audio-btn { background: #2563eb; color: white; font-size: 13px; font-weight: 700; padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }
    .enable-audio-btn.sound-off { background: #64748b; box-shadow: 0 4px 12px rgba(100,116,139,0.25); }
    /* Metrics Bar */
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .metric-card { background: var(--bg-card); padding: 20px 22px; border-radius: 16px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); }
    .metric-card.interactive { cursor: pointer; }
    .metric-card.interactive:hover { border-color: #3b82f6; transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .metric-card.active-metric-card { border-color: #2563eb; background: var(--hover-bg); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
    
    .metric-title { font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .metric-value { font-size: 26px; font-weight: 800; color: var(--text-main); }
    .metric-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .icon-orders { background: #eff6ff; color: #0284c7; }
    .icon-served { background: #f0fdf4; color: #16a34a; }
    .icon-revenue { background: #fefce8; color: #ca8a04; }
    [data-theme="dark"] .icon-orders { background: #075985; color: #bae6fd; }
    [data-theme="dark"] .icon-served { background: #14532d; color: #bbf7d0; }
    [data-theme="dark"] .icon-revenue { background: #713f12; color: #fef08a; }

    /* Filter Bar */
    .filter-section { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .table-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; width: 100%; }
    .table-nav::-webkit-scrollbar { display: none; }
    .table-chip { background: var(--bg-chip); border: 1px solid var(--border-chip); color: var(--text-chip); padding: 8px 18px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .table-chip.active { background: var(--chip-active-bg); color: var(--chip-active-text); border-color: var(--chip-active-bg); }

    .status-indicator-banner { background: #e0f2fe; color: #0369a1; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    [data-theme="dark"] .status-indicator-banner { background: #0c4a6e; color: #7dd3fc; }
    .status-indicator-banner button { background: none; border: none; color: inherit; cursor: pointer; font-weight: 800; text-decoration: underline; }

    /* Orders Grid */
    .orders-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 640px) { .orders-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .orders-grid { grid-template-columns: repeat(3, 1fr); } }

    .order-card { background: var(--bg-card); border-radius: 16px; padding: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); border-top: 5px solid #eab308; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s ease; }
    .order-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .order-card.preparing { border-top-color: #3b82f6; }
    .order-card.done { border-top-color: #22c55e; opacity: 0.9; }

    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
    .table-badge { font-size: 18px; font-weight: 800; color: var(--text-main); }
    .order-status { font-size: 11px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; background: #fef9c3; color: #854d0e; letter-spacing: 0.5px; }
    .preparing .order-status { background: #dbeafe; color: #1e40af; }
    .done .order-status { background: #dcfce7; color: #166534; }
    [data-theme="dark"] .order-status { background: #713f12; color: #fef08a; }
    [data-theme="dark"] .preparing .order-status { background: #1e3a8a; color: #bfdbfe; }
    [data-theme="dark"] .done .order-status { background: #14532d; color: #bbf7d0; }
    
    .order-time { font-size: 12px; color: var(--text-sub); font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 4px; }
    
    .items-list { list-style: none; margin-bottom: 16px; flex-grow: 1; }
    .items-list li { font-size: 14px; font-weight: 600; color: var(--text-main); padding: 8px 0; border-bottom: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .items-list li span.qty { color: #2563eb; font-weight: 800; background: #eff6ff; padding: 2px 8px; border-radius: 6px; }
    [data-theme="dark"] .items-list li span.qty { color: #38bdf8; background: #0c4a6e; }

    .order-footer { margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 14px; }
    .order-total { font-size: 16px; font-weight: 800; color: #22c55e; margin-bottom: 12px; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { border: none; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 13px; flex: 1; text-align: center; }
    .btn:active { transform: scale(0.96); }
    .btn-prepare { background: #3b82f6; color: white; }
    .btn-served { background: #22c55e; color: white; }
    .btn-archive { background: #64748b; color: white; }
    .btn-edit { background: var(--bg-body); color: var(--text-main); border: 1px solid var(--border-color); flex: none; }
    .btn-print { background: #8b5cf6; color: white; flex: none; }
    .btn-danger { background: #fef2f2; color: #ef4444; border: 1px solid #fecaca; flex: none; }
    [data-theme="dark"] .btn-danger { background: #450a0a; color: #fca5a5; border-color: #7f1d1d; }

    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-box { background: var(--modal-bg); border-radius: 20px; width: 100%; max-width: 800px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: var(--modal-header-bg); }
    .modal-header h2 { font-size: 18px; font-weight: 800; color: var(--text-main); }
    .modal-close { background: none; border: none; font-size: 20px; font-weight: 800; color: var(--text-sub); cursor: pointer; }
    .modal-body { padding: 24px; overflow-y: auto; flex-grow: 1; }
    
    .archive-table { width: 100%; border-collapse: collapse; text-align: left; }
    .archive-table th { font-size: 12px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; padding: 12px 16px; border-bottom: 2px solid var(--border-color); }
    .archive-table td { padding: 14px 16px; border-bottom: 1px solid var(--border-color); font-size: 14px; font-weight: 600; color: var(--text-main); }

    .empty-state { grid-column: 1 / -1; background: var(--bg-card); border-radius: 20px; text-align: center; padding: 70px 20px; border: 2px dashed var(--border-color); }
    .empty-icon { font-size: 48px; margin-bottom: 12px; display: inline-block; }
    .empty-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
    .empty-subtitle { font-size: 14px; color: var(--text-sub); max-width: 340px; margin: 0 auto; }

    #print-area { display: none; }

    @media print {
      body * { visibility: hidden; }
      #print-area, #print-area * { visibility: visible; }
      #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 72mm; font-family: monospace; color: #000; background: #fff; padding: 0; margin: 0; }
      .ticket-title { font-size: 20px; font-weight: bold; text-align: center; text-transform: uppercase; margin-bottom: 4px; }
      .ticket-sub { font-size: 12px; text-align: center; border-bottom: 1px dashed #000; padding-bottom: 6px; margin-bottom: 8px; }
      .ticket-table { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
      .ticket-time { font-size: 12px; border-bottom: 1px solid #000; padding-bottom: 6px; margin-bottom: 8px; }
      .ticket-items { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
      .ticket-items td { font-size: 14px; font-weight: bold; padding: 4px 0; vertical-align: top; }
      .ticket-items td.qty { text-align: right; width: 40px; }
      .ticket-divider { border-bottom: 1px dashed #000; margin: 8px 0; }
      .ticket-total { font-size: 16px; font-weight: bold; text-align: right; margin-top: 6px; }
      .ticket-footer { text-align: center; font-size: 11px; margin-top: 12px; font-style: italic; }
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div id="print-area"></div>

  <!-- Archive Drawer Modal -->
  <div class="modal-overlay" id="archive-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>📁 Archived Orders History</h2>
        <button class="modal-close" onclick="closeArchiveModal()">✕</button>
      </div>
      <div class="modal-body">
        <table class="archive-table">
          <thead>
            <tr>
              <th>Table</th>
              <th>Items</th>
              <th>Time</th>
              <th>Total</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="archive-list-body">
            <tr><td colspan="5" style="text-align:center; padding: 20px;">Loading archived records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- Stock Management Modal -->
  <div class="modal-overlay" id="inventory-modal">
    <div class="modal-box" style="max-width: 500px;">
      <div class="modal-header">
        <h2>🍱 Menu Availability (86ing)</h2>
        <button class="modal-close" onclick="closeInventoryModal()">✕</button>
      </div>
      <div class="modal-body" id="inventory-list"></div>
    </div>
  </div>

  <div class="dashboard-container">
    <div class="header">
      <div class="brand">
        <img src="31436.png" alt="TeaToast Logo" class="brand-logo">
        <h1>TeaToast Kitchen</h1>
        <div class="live-badge"><div class="live-dot"></div> Live Stream</div>

        <button class="btn-action" id="theme-toggle-btn" onclick="toggleTheme()">🌙 Dark Mode</button>
        <button class="btn-action" onclick="openInventoryModal()">🍱 Manage Stock</button>
        <button class="btn-action" onclick="openArchiveModal()">📦 View Archives</button>
        <button id="audio-btn" class="enable-audio-btn sound-off" onclick="toggleAudio()">🔔 Enable Sound</button>
      </div>

    <!-- Summary Metrics -->
    <div class="metrics-grid">
      <div class="metric-card interactive" id="card-pending" onclick="filterByStatus('Pending')">
        <div>
          <div class="metric-title">Pending Orders</div>
          <div class="metric-value" id="stat-pending">0</div>
        </div>
        <div class="metric-icon icon-orders">⏳</div>
      </div>
      <div class="metric-card interactive" id="card-served" onclick="filterByStatus('Served')">
        <div>
          <div class="metric-title">Served Orders</div>
          <div class="metric-value" id="stat-served">0</div>
        </div>
        <div class="metric-icon icon-served">✅</div>
      </div>
      <div class="metric-card">
        <div>
          <div class="metric-title">Shift Revenue</div>
          <div class="metric-value" id="stat-revenue">NPR 0</div>
        </div>

    <!-- Filter Bar -->

      <div class="table-nav" id="table-filter-bar">
        <button class="table-chip active" onclick="filterByTable('ALL')">Show All Tables</button>

    <!-- Orders Grid -->
    <div class="orders-grid" id="orders-list">
      <div class="empty-state">
        <div class="empty-icon">⏳</div>
        <div class="empty-title">Connecting to Firestore...</div>
        <div class="empty-subtitle">Please check your internet connection or database setup.</div>
      </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyC616K7b9vsNDcuVrXQpDYOS2L9h1OpxIw",
      authDomain: "my-cafe12.firebaseapp.com",
      projectId: "my-cafe12",
      storageBucket: "my-cafe12.firebasestorage.app",
      messagingSenderId: "621111977103",
      appId: "1:621111977103:web:0246bb820fa55f90a9fcfa"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let audioCtx = null;
    let soundEnabled = false;
    let isInitialLoad = true;
    let rawAllOrders = [];
    let activeOrders = [];
    let archivedOrders = [];
    let selectedTable = 'ALL';
    let selectedStatus = 'ALL';
    let outOfStockIds = [];

    const catalogItems = [
      { id: 1, name: "Special Masala Tea" },
      { id: 2, name: "Milk Coffee" },
      { id: 3, name: "Butter Toast" },
      { id: 4, name: "Cheese Toast" },
      { id: 5, name: "Veg Steam Momo" },
      { id: 6, name: "Chicken Chowmein" }
    ];

    window.addEventListener('load', () => {
      initTheme();
      initKitchenDisplay();
      initInventoryListener();
    });

    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        applyTheme(savedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        applyTheme(prefersDark ? 'dark' : 'light');
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      const nextTheme = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', nextTheme);
      applyTheme(nextTheme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('theme-toggle-btn');
      if (btn) btn.innerText = theme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }

    function initInventoryListener() {
      db.collection("inventory").doc("menu_status").onSnapshot(doc => {
        outOfStockIds = doc.exists ? (doc.data().outOfStock || []) : [];
        renderInventoryControls();
      });
    }

    async function toggleAudio() {
      const btn = document.getElementById('audio-btn');
      if (!soundEnabled) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') await audioCtx.resume();
          playChime();
          soundEnabled = true;
          btn.innerText = "🔕 Disable Sound";
          btn.style.background = "#22c55e";
          btn.classList.remove('sound-off');
        } catch (e) {
          alert("Audio blocked by browser. Please tap again.");
        }
      } else {
        soundEnabled = false;
        btn.innerText = "🔔 Enable Sound";
        btn.style.background = "#64748b";
        btn.classList.add('sound-off');
      }
    }

    function playChime() {
      if (!soundEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const now = audioCtx.currentTime;
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc1.type = 'sine'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(587.33, now);
      osc2.frequency.setValueAtTime(880, now + 0.15);

      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

      osc1.connect(gain); osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.start(now); osc1.stop(now + 0.15);
      osc2.start(now + 0.15); osc2.stop(now + 0.6);
    }

    function getMillis(ts) {
      if (ts && typeof ts.toMillis === 'function') return ts.toMillis();
      return Date.now();
    }function getTimeString(ts) {
      if (ts && typeof ts.toDate === 'function') {
        return ts.toDate().toLocaleTimeString('en-US', { timeZone: 'Asia/Kathmandu', hour: '2-digit', minute: '2-digit', hour12: true });
      }
      return "Just now";
    }

    function initKitchenDisplay() {
      isInitialLoad = true;
      db.collection("orders").onSnapshot(snapshot => {
        snapshot.docChanges().forEach(change => {
          if (change.type === "added" && !isInitialLoad) playChime();
        });
        
        isInitialLoad = false;
        rawAllOrders = []; activeOrders = []; archivedOrders = [];

        snapshot.forEach(doc => {
          const item = { id: doc.id, ...doc.data() };
          rawAllOrders.push(item);
          if (item.status === "Archived") {
            archivedOrders.push(item);
          } else {
            activeOrders.push(item);
          }
        });

        activeOrders.sort((a, b) => getMillis(b.timestamp) - getMillis(a.timestamp));
        archivedOrders.sort((a, b) => getMillis(b.timestamp) - getMillis(a.timestamp));

        updateMetrics();
        renderTableFilterBar();
        renderOrders();
        renderArchivedTable();
      }, error => {
        document.getElementById('orders-list').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⚠️</div>
            <div class="empty-title">Firestore Error</div>
            <div class="empty-subtitle" style="color: #ef4444;">${error.message}</div>
          </div>`;
      });
    }

    function updateMetrics() {
      const pendingCount = activeOrders.filter(o => o.status === 'Pending' || o.status === 'Preparing').length;
      const servedCount = activeOrders.filter(o => o.status === 'Served').length;
      const totalRev = rawAllOrders.reduce((sum, o) => sum + (o.total || 0), 0);

      document.getElementById('stat-pending').innerText = pendingCount;
      document.getElementById('stat-served').innerText = servedCount;
      document.getElementById('stat-revenue').innerText = `NPR ${totalRev}`;
    }

    function filterByStatus(status) {
      selectedStatus = selectedStatus === status ? 'ALL' : status;
      updateStatusIndicator();
      renderTableFilterBar();
      renderOrders();
    }

    function updateStatusIndicator() {
      const indicator = document.getElementById('status-filter-indicator');
      const cardPending = document.getElementById('card-pending');
      const cardServed = document.getElementById('card-served');

      cardPending.classList.remove('active-metric-card');
      cardServed.classList.remove('active-metric-card');

      if (selectedStatus === 'ALL') {
        indicator.style.display = 'none';
      } else {
        indicator.style.display = 'flex';
        indicator.innerHTML = `
          <div class="status-indicator-banner">
            Showing: <b>${selectedStatus} Orders</b> 
            <button onclick="filterByStatus('ALL')">Clear Filter</button>
          </div>`;
        if (selectedStatus === 'Pending') cardPending.classList.add('active-metric-card');
        if (selectedStatus === 'Served') cardServed.classList.add('active-metric-card');
      }
    }

    function renderTableFilterBar() {
      const filterBar = document.getElementById('table-filter-bar');
      const sourceList = selectedStatus === 'ALL' ? activeOrders : activeOrders.filter(o => o.status === selectedStatus);
      const uniqueTables = [...new Set(sourceList.map(o => String(o.table)))].sort();
      
      let html = `<button class="table-chip ${selectedTable === 'ALL' ? 'active' : ''}" onclick="filterByTable('ALL')">All Tables</button>`;
      uniqueTables.forEach(t => {
        html += `<button class="table-chip ${selectedTable === t ? 'active' : ''}" onclick="filterByTable('${t}')">${t === 'Takeaway' ? 'Takeaway' : 'Table #' + t}</button>`;
      });
      filterBar.innerHTML = html;
    }

    function filterByTable(tableNum) {
      selectedTable = tableNum;
      renderTableFilterBar();
      renderOrders();
    }

    function renderOrders() {
      const list = document.getElementById('orders-list');
      let filtered = activeOrders;
      if (selectedStatus !== 'ALL') filtered = filtered.filter(o => o.status === selectedStatus);
      if (selectedTable !== 'ALL') filtered = filtered.filter(o => String(o.table) === String(selectedTable));

      if (filtered.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">☕</div>
            <div class="empty-title">No Active Orders</div>
            <div class="empty-subtitle">There are no orders matching your selected filters right now.</div>
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(order => {
        const itemsText = order.items && order.items.length > 0 
          ? order.items.map(i => `<li><span>${i.name}</span> <span class="qty">x${i.qty}</span></li>`).join('')
          : '<li style="color:var(--text-sub); border:none;">No items recorded</li>';
        const formattedTime = getTimeString(order.timestamp);
        const cardClass = order.status === 'Served' ? 'done' : order.status === 'Preparing' ? 'preparing' : '';

        return `
          <div class="order-card ${cardClass}">
            <div>
              <div class="order-header">
                <span class="table-badge">${order.table === 'Takeaway' ? '🥡 Takeaway' : '🪑 Table ' + order.table}</span>
                <span class="order-status">${order.status}</span>
              </div>
              <div class="order-time">🕒 ${formattedTime}</div>
              <ul class="items-list">${itemsText}</ul>
            </div>
            <div class="order-footer">
              <div class="order-total">Total: NPR ${order.total || 0}</div>
              <div class="actions">
                ${order.status === 'Pending' 
                  ? `<button class="btn btn-prepare" onclick="updateOrderStatus('${order.id}', 'Preparing')">Prepare</button>` 
                  : order.status === 'Preparing'
                  ? `<button class="btn btn-served" onclick="updateOrderStatus('${order.id}', 'Served')">Serve</button>`
                  : `<button class="btn btn-archive" onclick="updateOrderStatus('${order.id}', 'Archived')">Archive</button>`
                }
                <button class="btn btn-print" onclick="printReceipt('${order.id}')" title="Print Ticket">🖨️ Ticket</button>
                <button class="btn btn-edit" onclick="editTableNumber('${order.id}', '${order.table}')" title="Edit Table">✏️</button>
                <button class="btn btn-danger" onclick="deleteOrder('${order.id}')" title="Delete Order">🗑️</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function renderArchivedTable() {
      const tbody = document.getElementById('archive-list-body');
      if (!tbody) return;

      if (archivedOrders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 24px; color:var(--text-sub);">No archived orders yet.</td></tr>`;
        return;
      }

      tbody.innerHTML = archivedOrders.map(o => {
        const timeStr = getTimeString(o.timestamp);
        const itemsSummary = o.items ? o.items.map(i => `${i.name} (x${i.qty})`).join(', ') : 'No items';
        return `
          <tr>
            <td><b>${o.table === 'Takeaway' ? '🥡 Takeaway' : 'Table #' + o.table}</b></td>
            <td>${itemsSummary}</td>
            <td>${timeStr}</td>
            <td style="color:#22c55e;">NPR ${o.total || 0}</td>
            <td>
              <button class="btn btn-edit" onclick="updateOrderStatus('${o.id}', 'Served')">Unarchive</button>
              <button class="btn btn-print" onclick="printReceipt('${o.id}')">🖨️</button>
            </td>
          </tr>`;
      }).join('');
    }

    function openArchiveModal() { document.getElementById('archive-modal').style.display = 'flex'; }
    function closeArchiveModal() { document.getElementById('archive-modal').style.display = 'none'; }
    function openInventoryModal() { document.getElementById('inventory-modal').style.display = 'flex'; renderInventoryControls(); }
    function closeInventoryModal() { document.getElementById('inventory-modal').style.display = 'none'; }

    function renderInventoryControls() {
      const container = document.getElementById('inventory-list');
      if (!container) return;

      container.innerHTML = catalogItems.map(item => {
        const isSoldOut = outOfStockIds.includes(item.id);
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border-color);">
            <span style="font-weight:700; font-size:14px; color:var(--text-main);">${item.name}</span>
            <button 
              onclick="toggleStockStatus(${item.id})"
              style="padding:6px 14px; border-radius:8px; font-weight:700; font-size:12px; cursor:pointer; border:none; ${
                isSoldOut ? 'background:#fef2f2; color:#ef4444; border:1px solid #fecaca;' : 'background:#f0fdf4; color:#16a34a; border:1px solid #bbf7d0;'
              }">
              ${isSoldOut ? '🔴 Sold Out' : '🟢 In Stock'}
            </button>
          </div>`;
      }).join('');
    }

    async function toggleStockStatus(itemId) {
      let updated = outOfStockIds.includes(itemId)
        ? outOfStockIds.filter(id => id !== itemId)
        : [...outOfStockIds, itemId];

      await db.collection("inventory").doc("menu_status").set({ outOfStock: updated }, { merge: true });
    }

    function printReceipt(id) {
      const order = rawAllOrders.find(o => o.id === id);
      if (!order) return;
      const formattedTime = getTimeString(order.timestamp);
      let itemsRows = order.items ? order.items.map(item => `<tr><td>${item.name}</td><td class="qty">x${item.qty}</td></tr>`).join('') : '';

      document.getElementById('print-area').innerHTML = `
        <div class="ticket-title">TeaToast</div>
        <div class="ticket-sub">KITCHEN TICKET</div>
        <div class="ticket-table">${order.table === 'Takeaway' ? 'TAKEAWAY ORDER' : 'TABLE #' + order.table}</div>
        <div class="ticket-time">Time: ${formattedTime}</div>
        <table class="ticket-items"><tbody>${itemsRows}</tbody></table>
        <div class="ticket-divider"></div>
        <div class="ticket-total">TOTAL: NPR ${order.total || 0}</div>
        <div class="ticket-footer">--- Order ID: ${id.substring(0, 8)} ---</div>`;
      window.print();
    }
    async function updateOrderStatus(id, newStatus) { await db.collection("orders").doc(id).update({ status: newStatus }); }
    async function editTableNumber(id, currentTable) {
      const newTable = prompt("Enter correct Table Number or 'Takeaway':", currentTable);
      if (newTable && newTable.trim() !== "" && newTable !== currentTable) {
        await db.collection("orders").doc(id).update({ table: newTable.trim() });
      }
    }
    async function deleteOrder(id) {
      if (confirm("Are you sure you want to delete this order?")) {
        await db.collection("orders").doc(id).delete();
      }
    }
  </script>
</body>
</html>
